{% extends 'staticpatchcore/base.html' %}

{% block title %}New Site - StaticPatch{% endblock %}

{% block content %}
    <h1>New Site</h1>
    <form method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <div class="form-actions">
            <input type="submit" value="Create Site">
            <a href="{% url 'admin_site_list' %}" class="button">Cancel</a>
        </div>
    </form>
{% endblock %}
