{% extends 'staticpatchcore/base.html' %}

{% block title %}New Basic Auth User - {{ site.slug }} - StaticPatch{% endblock %}

{% block content %}
    <h1>New Basic Auth User - {{ site.slug }}</h1>
    <form method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <div class="form-actions">
            <input type="submit" value="Create Basic Auth User">
            <a href="{% url 'admin_site_detail' site.slug %}" class="button">Cancel</a>
        </div>
    </form>
{% endblock %}
