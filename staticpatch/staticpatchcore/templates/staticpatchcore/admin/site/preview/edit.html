{% extends "staticpatchcore/base.html" %}

{% block content %}
    <h1>Edit Preview Type: {{ preview_type.slug }}</h1>

    <form method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <div class="form-actions">
            <input type="submit" value="Save Changes">
            <a href="{% url 'admin_site_preview_type_detail' site_slug=site.slug preview_type_slug=preview_type.slug %}" " class="button">Cancel</a>
        </div>
    </form>
{% endblock %}
