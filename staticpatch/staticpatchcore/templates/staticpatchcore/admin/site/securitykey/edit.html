{% extends "staticpatchcore/base.html" %}

{% block content %}
    <h1>Edit Security Key</h1>
    
    <form method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <div class="form-actions">
            <input type="submit" value="Save Changes">
            <a href="{% url 'admin_site_detail' site_slug=site.slug %}}" class="button">Cancel</a>
        </div>
    </form>
{% endblock %}
